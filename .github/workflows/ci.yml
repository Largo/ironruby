name: CI

on:
  push:
    branches: [master, modernize, 'ci/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build-and-test:
    name: ${{ matrix.os }} ${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        tfm: [net8.0, net10.0]
        include:
          # IronRuby.Tests "> FAILED" line counts, measured on this matrix (run
          # 35731760445). They are the exact current numbers, not head-room: the
          # job fails as soon as one more line appears. Windows and Linux fail the
          # same tests; the two runtimes differ only in Serialization1, which
          # produces one line on net10.0 and two on net8.0.
          - os: ubuntu-latest
            tfm: net8.0
            baseline: 19
          - os: ubuntu-latest
            tfm: net10.0
            baseline: 18
          - os: windows-latest
            tfm: net8.0
            baseline: 19
          - os: windows-latest
            tfm: net10.0
            baseline: 18
    env:
      TFM: ${{ matrix.tfm }}
      IR_TFM: ${{ matrix.tfm }}
      BASELINE: ${{ matrix.baseline }}
    defaults:
      run:
        shell: bash
    steps:
      # The tree stores many sources with CRLF already; the Windows runner's
      # global core.autocrlf=true would rewrite the LF ones on checkout and
      # change the bytes the parser and the tests see.
      - name: Keep checkouts byte-identical on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - name: Check out IronRuby
        uses: actions/checkout@v4
        with:
          path: ironruby

      # The modern DLR is referenced as source projects from a sibling directory,
      # and prism supplies the parser itself.
      - name: Check out the DLR
        uses: actions/checkout@v4
        with:
          repository: IronLanguages/dlr
          path: dlr

      - name: Check out prism
        uses: actions/checkout@v4
        with:
          repository: ruby/prism
          path: prism

      # IronRuby uses DLR APIs that are not upstream yet; the patches that add
      # them live in Build/dlr-patches and go onto the fresh upstream checkout.
      - name: Patch the DLR
        run: |
          for patch in ironruby/Build/dlr-patches/*.patch; do
            echo "applying $patch"
            git -C dlr apply "../$patch"
          done

      # Both runtimes are installed on every matrix entry: the SDK builds either
      # target framework, but running the net8.0 output needs the .NET 8 runtime.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.os }}-${{ hashFiles('ironruby/**/*.csproj', 'ironruby/Directory.Build.props', 'dlr/**/*.csproj') }}
          restore-keys: nuget-${{ matrix.os }}-

      - name: Identify the prism checkout
        id: prism
        run: echo "sha=$(git -C prism rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the prism build
        id: prism-cache
        uses: actions/cache@v4
        with:
          path: prism/build
          key: prism-${{ matrix.os }}-${{ steps.prism.outputs.sha }}

      # On Linux prism's own Makefile does it. prism's own CI never runs
      # `make shared` on Windows - it builds the extension through mkmf - and the
      # Makefile is written for a Unix toolchain (SOEXT out of RbConfig, -Werror
      # together with -fPIC, which MinGW has nothing to do with), so rather than
      # bend it, link the same sources directly with the MSYS2 gcc that
      # ruby/setup-ruby puts on PATH. -DPRISM_EXPORT_SYMBOLS is what the
      # Makefile's shared objects are compiled with too: it turns prism's
      # PRISM_EXPORTED_FUNCTION into __declspec(dllexport) on _WIN32, which is
      # what makes the P/Invokes in Src/Prism/PrismNative.cs resolvable.
      - name: Build libprism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        working-directory: prism
        run: |
          ruby templates/template.rb
          if [ "$RUNNER_OS" = Windows ]; then
            command -v gcc >/dev/null || export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
            gcc --version
            mkdir -p build
            shopt -s nullglob          # prism has no src subdirectories today
            sources=(src/*.c src/*/*.c)
            gcc -shared -O2 -std=c99 -DPRISM_EXPORT_SYMBOLS -Iinclude \
              -o build/libprism.dll "${sources[@]}"
          else
            make shared
          fi
          ls -l build

      - name: Generate the C# prism loader
        working-directory: ironruby/Src/Prism
        run: ruby generate.rb

      - name: Build
        working-directory: ironruby
        run: dotnet build Src/Console/Ruby.Console.csproj -p:IronRubyTargetFrameworks=$TFM

      - name: Smoke test
        working-directory: ironruby
        run: |
          cat > smoke.rb <<'RUBY'
          puts "#{RUBY_ENGINE} #{RUBY_VERSION} on #{RUBY_PLATFORM}"

          case {name: "prism", version: 1}
          in {name: String => name, version: Integer => v}
            puts "pattern matching: #{name} v#{v}"
          end

          def greet(name:, greeting: "Hello") = "#{greeting}, #{name}!"
          puts greet(name: "world")

          puts [1, 2, 3].filter_map { it * 10 if it.odd? }.inspect
          puts (nil&.length).inspect
          puts (2**100).to_s.length

          # Bundled gems, from Src/StdLib/ruby/gems - the runner's Ruby 3.3 offers none.
          require "rexml/document"
          require "csv"
          require "rake"
          puts "rexml #{REXML::VERSION}, csv #{CSV::VERSION}, rake #{Rake::VERSION}"
          RUBY
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ir.cmd smoke.rb
          else
            ./ir.sh smoke.rb
          fi

      # irubyc --single-file: one executable carrying IronRuby, libprism and the stdlib.
      # Run from an empty directory, so it can only work if everything really is inside it.
      - name: irubyc single file
        working-directory: ironruby
        run: |
          mkdir -p sf-app/lib
          cat > sf-app/app.rb <<'RUBY'
          require "yaml"
          require "json"
          require_relative "lib/greeter"
          def fib(n) = n < 2 ? n : fib(n - 1) + fib(n - 2)
          puts "fib=#{fib(20)} #{Greeter.hello} yaml=#{{"a" => 1}.to_yaml.lines.last.strip} json=#{JSON.generate([1])} eval=#{eval("1 + 2")}"
          RUBY
          printf 'module Greeter\n  def self.hello = "hello"\nend\n' > sf-app/lib/greeter.rb
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c ir.cmd -S irubyc --single-file -t sf-out sf-app/app.rb sf-app/lib/
            exe=app.exe
          else
            ./ir.sh -S irubyc --single-file -t sf-out sf-app/app.rb sf-app/lib/
            exe=app
          fi
          ls -la sf-out/app
          count=$(ls sf-out/app | wc -l)
          [ "$count" -eq 1 ] || { echo "expected exactly one file, got $count"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sf-alone" "$RUNNER_TEMP/sf-extract"
          cp "sf-out/app/$exe" "$RUNNER_TEMP/sf-alone/"
          cd "$RUNNER_TEMP/sf-alone"
          out=$(DOTNET_BUNDLE_EXTRACT_BASE_DIR="$RUNNER_TEMP/sf-extract" "./$exe")
          echo "$out"
          [ "$out" = "fib=6765 hello yaml=a: 1 json=[1] eval=3" ]

      - name: Bridge the bundled standard libraries
        working-directory: ironruby
        run: |
          dotnet build Src/Prism/IronRuby.Prism.csproj -p:IronRubyTargetFrameworks=$TFM
          EXE=""
          [ "$RUNNER_OS" = Windows ] && EXE=.exe
          SWEEP="Src/Prism/bin/Debug/$TFM/IronRuby.Prism$EXE"
          "$SWEEP" --sweep Src/StdLib/ruby/4.0 | tee sweep40.txt
          grep -q '0 failed' sweep40.txt
          "$SWEEP" --sweep Src/StdLib/ruby/1.9.1 | tee sweep19.txt
          grep -q '0 failed' sweep19.txt
          "$SWEEP" --sweep Src/StdLib/ruby/gems | tee sweepgems.txt
          grep -q '0 failed' sweepgems.txt

      - name: IronRuby test suite
        working-directory: ironruby
        run: |
          dotnet build Src/IronRuby.Tests/IronRuby.Tests.csproj -p:IronRubyTargetFrameworks=$TFM
          EXE=""
          [ "$RUNNER_OS" = Windows ] && EXE=.exe
          cd "Src/IronRuby.Tests/bin/Debug/$TFM"
          "./IronRuby.Tests$EXE" > results.txt 2>&1 || true
          failures=$(grep -c '^> FAILED' results.txt || true)
          echo "failure lines: $failures (baseline $BASELINE)"
          echo "::group::failing tests"
          grep -oE '^> FAILED: .*' results.txt | sort | uniq -c | sort -rn
          echo "::endgroup::"
          if [ "$failures" -gt "$BASELINE" ]; then
            echo "::group::first failures in detail"
            sed -n '/^ *1)/,/^ *8)/p' results.txt
            echo "::endgroup::"
            exit 1
          fi

      # The full transcript, for looking at a failure that is inside the baseline.
      - name: Keep the test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironruby-tests-${{ matrix.os }}-${{ matrix.tfm }}
          path: ironruby/Src/IronRuby.Tests/bin/Debug/${{ matrix.tfm }}/results.txt
          if-no-files-found: ignore

  ruby-spec:
    name: ruby/spec ${{ matrix.tfm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tfm: [net8.0, net10.0]
    env:
      TFM: ${{ matrix.tfm }}
      IR_TFM: ${{ matrix.tfm }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ironruby
      - uses: actions/checkout@v4
        with:
          repository: IronLanguages/dlr
          path: dlr
      - uses: actions/checkout@v4
        with:
          repository: ruby/prism
          path: prism
      - uses: actions/checkout@v4
        with:
          repository: ruby/spec
          path: ironruby/spec
      - uses: actions/checkout@v4
        with:
          repository: ruby/mspec
          path: ironruby/mspec

      - name: Patch the DLR
        shell: bash
        run: |
          for patch in ironruby/Build/dlr-patches/*.patch; do
            echo "applying $patch"
            git -C dlr apply "../$patch"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-ubuntu-latest-${{ hashFiles('ironruby/**/*.csproj', 'ironruby/Directory.Build.props', 'dlr/**/*.csproj') }}
          restore-keys: nuget-ubuntu-latest-

      - name: Identify the prism checkout
        id: prism
        run: echo "sha=$(git -C prism rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the prism build
        id: prism-cache
        uses: actions/cache@v4
        with:
          path: prism/build
          key: prism-ubuntu-latest-${{ steps.prism.outputs.sha }}

      - name: Build libprism
        if: steps.prism-cache.outputs.cache-hit != 'true'
        working-directory: prism
        run: |
          ruby templates/template.rb
          make shared

      - name: Build
        working-directory: ironruby
        run: |
          ruby Src/Prism/generate.rb
          dotnet build Src/Console/Ruby.Console.csproj -p:IronRubyTargetFrameworks=$TFM

      - name: Run the ruby/spec language suite
        working-directory: ironruby
        run: |
          RUBY_EXE="$PWD/ir.sh" ./ir.sh -Imspec/lib mspec/bin/mspec-run spec/language \
            2>&1 | tee spec.txt || true
          tail -3 spec.txt
