name: Release

# Binary builds: a self-contained IronRuby for each platform, made by
# Util/package-release.sh, and the launch video, rendered from media/launch. Pushing a
# tag v* publishes them as a GitHub release (a pre-release while the version has a
# suffix such as -preview1), with Docs/releases/<tag>.md as the notes when there is one;
# running the workflow by hand, or a pull request that changes the packaging or the
# video, only keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Util/package-release.sh
      - media/launch/**
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  # Unlike CI, which follows prism's main branch, a release is built from the prism
  # revision Src/Prism/Generated was generated from (Src/Prism/README.md), the one the
  # vendored Ruby half of prism in Src/StdLib belongs to.
  PRISM_REF: c53699f7f20f6b6aa4704216fbfecec897fe419a

jobs:
  package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    # macOS is untested (README, Platforms): a failure there does not hold the release back.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, experimental: false }
          - { os: windows-latest, rid: win-x64,   experimental: false }
          - { os: macos-latest,   rid: osx-arm64, experimental: true }
    defaults:
      run:
        shell: bash
    steps:
      # See ci.yml: the sources must reach the parser byte for byte.
      - name: Keep checkouts byte-identical on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
        with:
          path: ironruby

      - uses: actions/checkout@v7
        with:
          repository: IronLanguages/dlr
          path: dlr

      - uses: actions/checkout@v7
        with:
          repository: ruby/prism
          ref: ${{ env.PRISM_REF }}
          path: prism

      - name: Patch the DLR
        run: |
          for patch in ironruby/Build/dlr-patches/*.patch; do
            echo "applying $patch"
            git -C dlr apply "../$patch"
          done

      # The DLR multi-targets up to net9.0, so the build needs the .NET 10 SDK; the
      # release itself targets net8.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Built as in ci.yml; see there for why Windows links the sources directly.
      - name: Build libprism
        working-directory: prism
        run: |
          ruby templates/template.rb
          if [ "$RUNNER_OS" = Windows ]; then
            command -v gcc >/dev/null || export PATH="/c/msys64/ucrt64/bin:/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
            mkdir -p build
            shopt -s nullglob
            sources=(src/*.c src/*/*.c)
            gcc -shared -O2 -std=c99 -DPRISM_EXPORT_SYMBOLS -Iinclude \
              -o build/libprism.dll "${sources[@]}"
          else
            make shared
          fi
          ls -l build

      # The committed loader must be the one this prism revision generates; a mismatch
      # would build fine and then misread the syntax tree.
      - name: Check the prism loader against the prism revision
        working-directory: ironruby/Src/Prism
        run: |
          ruby generate.rb ../../../prism/config.yml "$RUNNER_TEMP/prism-gen"
          diff -r --strip-trailing-cr Generated "$RUNNER_TEMP/prism-gen"

      - name: Package
        working-directory: ironruby
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            export IR_VERSION="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/.*DisplayVersion = "\(.*\)";.*/\1/p' Src/Ruby/CurrentVersion.cs)
            export IR_VERSION="$version+$(git rev-parse --short HEAD)"
          fi
          Util/package-release.sh "${{ matrix.rid }}" "$GITHUB_WORKSPACE/dist"

      # The Windows archive carries Samples/Notepad: drive it from the unpacked tree, on
      # the Release build the archive ships. package-release.sh leaves the tree in dist/.
      - name: Notepad sample, from the archive
        if: runner.os == 'Windows'
        timeout-minutes: 5
        working-directory: dist
        run: cd ironruby-*-win-x64 && cmd //c ir.cmd Samples/Notepad/test_notepad.rb

      - uses: actions/upload-artifact@v7
        with:
          name: ironruby-${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # media/launch is a HyperFrames composition (media/launch/README.md). A video that
  # does not render does not hold the archives back.
  video:
    name: launch video
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # lint is static and must pass; check also audits layout and contrast in the
      # browser and only warns here. The version is pinned in package.json.
      - name: Check and render
        working-directory: media/launch
        env:
          HYPERFRAMES_SKIP_SKILLS: 1
        run: |
          hf="npx --yes hyperframes@$(sed -n 's/.*hyperframes@\([0-9.]*\).*/\1/p' package.json | head -1)"
          $hf telemetry disable
          $hf lint
          $hf browser ensure
          $hf check || echo "::warning::hyperframes check reported findings"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          $hf render --fps 60 --quality high --output "$GITHUB_WORKSPACE/dist/ironruby-4-launch.mp4"
          $hf snapshot --frames 12

      - uses: actions/upload-artifact@v7
        with:
          name: ironruby-launch-video
          path: dist/ironruby-4-launch.mp4
          if-no-files-found: error

      # Stills across the film, to look at a render without downloading it.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: launch-video-frames
          path: media/launch/snapshots
          if-no-files-found: ignore

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [package, video]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: Docs/releases

      # ironruby-* only: the archives and the video, not the review stills.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: ironruby-*
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          notes=()
          if [ -f "Docs/releases/$GITHUB_REF_NAME.md" ]; then
            notes=(--notes-file "Docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "IronRuby ${GITHUB_REF_NAME#v}" \
            "${notes[@]}" --generate-notes $prerelease
